{% extends 'base.html' %}
{% block content %}
<section class="card">
  <h1>My Plans</h1>
  {% if plans %}
  <ul class="list">
    {% for p in plans %}
      <li>
        <a href="{{ url_for('view_plan', plan_id=p['id']) }}">{{ p['title'] }}</a>
        <span class="muted">{{ p['created_at'] }}</span>
      </li>
    {% endfor %}
  </ul>
  {% else %}
    <p>No plans yet. <a href="/">Create one</a>.</p>
  {% endif %}
</section>
{% endblock %}
