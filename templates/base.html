<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or 'AI Study Planner' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  {% block head %}{% endblock %}
  </head>
<body>
  <header class="container header">
    <div class="brand"><a href="{{ url_for('index') }}">AI Study Planner</a></div>
    <nav>
      <a href="{{ url_for('generate') }}">Generate</a>
      <a href="{{ url_for('list_plans') }}">My Plans</a>
      <button id="themeToggle" class="btn btn-secondary" aria-label="Toggle theme">🌓</button>
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flash">
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="container footer">
    <p>Built with Flask + Gemini</p>
  </footer>
</body>
</html>
